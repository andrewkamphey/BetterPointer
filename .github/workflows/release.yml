name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build universal app
        run: ARCH=universal ./build.sh

      - name: Zip app
        run: |
          cd dist
          ditto -c -k --keepParent "Where's My Mouse.app" WheresMyMouse.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WheresMyMouse
          path: dist/WheresMyMouse.zip

      - name: Update nightly release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automated build from the latest commit on main.

            **Commit:** ${{ github.sha }}
          files: dist/WheresMyMouse.zip
          prerelease: true

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WheresMyMouse.zip
          generate_release_notes: true
